services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hustera_db
      MYSQL_USER: hustera
      MYSQL_PASSWORD: hustera
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/husteradb_final.sql:/docker-entrypoint-initdb.d/01-husteradb_final.sql
      - ./backend/sql/admin.sql:/docker-entrypoint-initdb.d/02_admin.sql
      - ./backend/sql/tags.sql:/docker-entrypoint-initdb.d/03_tags.sql
      - ./backend/sql/instructors.sql:/docker-entrypoint-initdb.d/04_instructors.sql
      - ./backend/sql/courses.sql:/docker-entrypoint-initdb.d/05_courses.sql
      - ./backend/sql/enroll.sql:/docker-entrypoint-initdb.d/06_enroll.sql
      - ./backend/sql/reviews.sql:/docker-entrypoint-initdb.d/07_reviews.sql
      - ./backend/sql/threads.sql:/docker-entrypoint-initdb.d/08_threads.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: hustera
      DB_PASSWORD: hustera
      DB_NAME: hustera_db
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
